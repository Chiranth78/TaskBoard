name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master # Or main, depending on your default branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Or your preferred Node.js version
          cache: 'npm'

      - name: Install dependencies
        run: npm ci # Or yarn install
      
      - name: Set environment variables
        run: |
          echo NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.AIzaSyA-28qx7ESIwCka76Pu0O3wDkf1nRSgpFI }} >> $GITHUB_ENV
          echo NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.taskgrid-gx2rk.firebaseapp.com }} >> $GITHUB_ENV
          echo NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.taskgrid-gx2rk }} >> $GITHUB_ENV
          echo NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ secrets.taskgrid-gx2rk.firebasestorage.app }} >> $GITHUB_ENV
          echo NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.1020397139722 }} >> $GITHUB_ENV
          echo NEXT_PUBLIC_FIREBASE_APP_ID=${{ secrets.1:1020397139722:web:bf65cf8c82d1dbc5ae2cf3 }} >> $GITHUB_ENV

      - name: Build
        run: npm run build # Or yarn build

      - name: Static export
        run: npm run export # only necessary if you are using static export

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: out # Or .next if you want to deploy the next folder. You will probably use out for static export.
          token: ${{ secrets.GITHUB_TOKEN }}
